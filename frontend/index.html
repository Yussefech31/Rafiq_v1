<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RAFIQ — Assistant IA pour les procédures administratives du Ministère de la Transition Numérique">
    <title>RAFIQ — Assistant Administratif IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== Design Tokens ===== */
        :root {
            --bg-deep: #0a0f1c;
            --bg-dark: #111827;
            --bg-card: rgba(17, 24, 39, 0.65);
            --bg-card-hover: rgba(17, 24, 39, 0.8);
            --bg-input: rgba(15, 23, 42, 0.7);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glass-hover: rgba(255, 255, 255, 0.15);

            --accent-teal: #10b981;
            --accent-teal-dim: rgba(16, 185, 129, 0.15);
            --accent-teal-glow: rgba(16, 185, 129, 0.3);
            --accent-gold: #f59e0b;
            --accent-gold-dim: rgba(245, 158, 11, 0.15);

            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            --confidence-high: #10b981;
            --confidence-medium: #f59e0b;
            --confidence-low: #ef4444;
            --abstain-bg: rgba(239, 68, 68, 0.12);
            --abstain-border: rgba(239, 68, 68, 0.4);

            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;

            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --transition-fast: 180ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 350ms cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-glow: 0 0 30px rgba(16, 185, 129, 0.08);
        }

        /* ===== Reset & Base ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: var(--font-family);
            background: linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-dark) 50%, #0d1321 100%);
            color: var(--text-primary);
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 600px 400px at 15% 20%, rgba(16, 185, 129, 0.04), transparent),
                radial-gradient(ellipse 500px 500px at 85% 80%, rgba(245, 158, 11, 0.03), transparent);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== App Shell ===== */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* ===== Top Bar ===== */
        .topbar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 24px;
            background: rgba(10, 15, 28, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
            flex-shrink: 0;
        }

        .topbar-logo {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--accent-teal), #059669);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            letter-spacing: -0.5px;
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }

        .topbar-text h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-teal));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .topbar-text .subtitle {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 400;
            margin-top: 2px;
        }

        /* ===== Chat Area ===== */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        /* Welcome Screen */
        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
            animation: fadeInUp 0.6s var(--transition-smooth);
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            border-radius: var(--radius-lg);
            background: linear-gradient(135deg, var(--accent-teal-dim), var(--accent-gold-dim));
            border: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 24px;
        }

        .welcome h2 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .welcome p {
            color: var(--text-secondary);
            font-size: 15px;
            max-width: 460px;
            line-height: 1.6;
        }

        .welcome-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 28px;
            justify-content: center;
            max-width: 600px;
        }

        .suggestion-chip {
            padding: 10px 18px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-glass);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .suggestion-chip:hover {
            border-color: var(--accent-teal);
            color: var(--accent-teal);
            background: var(--accent-teal-dim);
            transform: translateY(-1px);
        }

        /* ===== Message Bubbles ===== */
        .message {
            animation: fadeInUp 0.4s ease-out;
        }

        .message-question {
            align-self: flex-end;
            max-width: 70%;
        }

        .message-question .bubble {
            background: linear-gradient(135deg, var(--accent-teal), #059669);
            color: #fff;
            padding: 14px 20px;
            border-radius: var(--radius-lg) var(--radius-lg) 6px var(--radius-lg);
            font-size: 15px;
            line-height: 1.6;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.15);
        }

        .message-answer {
            align-self: flex-start;
            max-width: 85%;
        }

        .answer-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow-glow);
            transition: border-color var(--transition-fast);
        }

        .answer-card:hover {
            border-color: var(--border-glass-hover);
        }

        .answer-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 12px;
            border-radius: var(--radius-xl);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-confidence-high {
            background: rgba(16, 185, 129, 0.12);
            color: var(--confidence-high);
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .badge-confidence-medium {
            background: rgba(245, 158, 11, 0.12);
            color: var(--confidence-medium);
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        .badge-confidence-low {
            background: rgba(239, 68, 68, 0.12);
            color: var(--confidence-low);
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        .badge-regime {
            background: rgba(99, 102, 241, 0.12);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.25);
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .answer-text {
            font-size: 15px;
            line-height: 1.75;
            color: var(--text-primary);
            margin-bottom: 14px;
        }

        /* RTL support for Arabic */
        .answer-text[dir="rtl"] {
            text-align: right;
            font-size: 16px;
        }

        /* Abstain Warning */
        .abstain-banner {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: var(--radius-md);
            background: var(--abstain-bg);
            border: 1px solid var(--abstain-border);
            margin-bottom: 14px;
            animation: pulseWarn 2s infinite;
        }

        .abstain-banner .icon { font-size: 22px; }
        .abstain-banner .text {
            font-size: 13px;
            color: #fca5a5;
            font-weight: 500;
            line-height: 1.5;
        }

        /* Sources */
        .sources-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-glass);
            background: transparent;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-family: var(--font-family);
        }

        .sources-toggle:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .sources-toggle .arrow {
            transition: transform var(--transition-fast);
            font-size: 10px;
        }

        .sources-toggle.open .arrow {
            transform: rotate(180deg);
        }

        .sources-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height var(--transition-smooth), opacity var(--transition-smooth);
            opacity: 0;
        }

        .sources-list.open {
            max-height: 400px;
            opacity: 1;
            margin-top: 12px;
        }

        .source-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .source-item .idx {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent-gold-dim);
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
        }

        .source-item .score {
            margin-left: auto;
            flex-shrink: 0;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Answer Actions */
        .answer-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--border-glass);
        }

        .btn-validate {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--accent-gold);
            background: var(--accent-gold-dim);
            color: var(--accent-gold);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all var(--transition-fast);
            font-family: var(--font-family);
        }

        .btn-validate:hover {
            background: rgba(245, 158, 11, 0.25);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(245, 158, 11, 0.15);
        }

        /* ===== Loading ===== */
        .loading-indicator {
            align-self: flex-start;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 22px;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            animation: fadeInUp 0.3s ease-out;
        }

        .loading-dots {
            display: flex;
            gap: 5px;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-teal);
            animation: dotPulse 1.4s ease-in-out infinite;
        }

        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        .loading-label {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* ===== Input Area ===== */
        .input-area {
            padding: 16px 24px 20px;
            background: rgba(10, 15, 28, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-glass);
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-input);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            padding: 6px 6px 6px 20px;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-teal);
            box-shadow: 0 0 0 3px var(--accent-teal-dim), var(--shadow-glow);
        }

        .input-wrapper input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 15px;
            font-family: var(--font-family);
        }

        .input-wrapper input::placeholder {
            color: var(--text-muted);
        }

        .btn-send {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--accent-teal), #059669);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all var(--transition-fast);
            font-size: 18px;
        }

        .btn-send:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-send:active {
            transform: scale(0.95);
        }

        .btn-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-send svg {
            width: 20px;
            height: 20px;
        }

        /* ===== Animations ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        @keyframes pulseWarn {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }

        /* ===== Responsive ===== */
        @media (max-width: 640px) {
            .topbar { padding: 12px 16px; }
            .topbar-logo { width: 36px; height: 36px; font-size: 15px; }
            .topbar-text h1 { font-size: 17px; }
            .chat-container { padding: 16px; }
            .message-question { max-width: 90%; }
            .message-answer { max-width: 95%; }
            .input-area { padding: 12px 16px 16px; }
            .welcome h2 { font-size: 21px; }
            .welcome-suggestions { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- ===== Top Bar ===== -->
        <header class="topbar">
            <div class="topbar-logo">R</div>
            <div class="topbar-text">
                <h1>RAFIQ</h1>
                <div class="subtitle">Ministère de la Transition Numérique</div>
            </div>
        </header>

        <!-- ===== Chat Area ===== -->
        <main class="chat-container" id="chatContainer">
            <div class="welcome" id="welcomeScreen">
                <div class="welcome-icon">🏛️</div>
                <h2>Bienvenue sur RAFIQ</h2>
                <p>Posez votre question sur les procédures administratives. RAFIQ consulte le catalogue des services e-gouvernement pour vous répondre.</p>
                <div class="welcome-suggestions">
                    <button class="suggestion-chip" onclick="useSuggestion(this)">Quels documents pour un certificat de résidence ?</button>
                    <button class="suggestion-chip" onclick="useSuggestion(this)">Comment renouveler le passeport biométrique ?</button>
                    <button class="suggestion-chip" onclick="useSuggestion(this)">ما هي شروط الحصول على بطاقة التعريف الوطنية؟</button>
                    <button class="suggestion-chip" onclick="useSuggestion(this)">Délais pour un extrait de casier judiciaire ?</button>
                </div>
            </div>
        </main>

        <!-- ===== Input Area ===== -->
        <footer class="input-area">
            <div class="input-wrapper">
                <input
                    type="text"
                    id="questionInput"
                    placeholder="Posez votre question... / اطرح سؤالك..."
                    autocomplete="off"
                    aria-label="Question"
                >
                <button class="btn-send" id="sendBtn" aria-label="Envoyer">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <script>
        // ===== State =====
        const chatContainer = document.getElementById('chatContainer');
        const questionInput = document.getElementById('questionInput');
        const sendBtn = document.getElementById('sendBtn');
        const welcomeScreen = document.getElementById('welcomeScreen');
        let isLoading = false;

        // ===== Helpers =====
        function detectDir(text) {
            // Detect Arabic script → RTL
            const arabicRegex = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/;
            return arabicRegex.test(text) ? 'rtl' : 'ltr';
        }

        function confidenceLevel(score) {
            if (score >= 0.75) return 'high';
            if (score >= 0.45) return 'medium';
            return 'low';
        }

        function confidenceLabel(level) {
            const labels = { high: 'Confiance élevée', medium: 'Confiance moyenne', low: 'Confiance faible' };
            return labels[level] || level;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }

        // ===== Render =====
        function addQuestion(text) {
            if (welcomeScreen) {
                welcomeScreen.remove();
            }
            const dir = detectDir(text);
            const div = document.createElement('div');
            div.className = 'message message-question';
            div.innerHTML = `<div class="bubble" dir="${dir}">${escapeHtml(text)}</div>`;
            chatContainer.appendChild(div);
            scrollToBottom();
        }

        function showLoading() {
            const div = document.createElement('div');
            div.className = 'loading-indicator';
            div.id = 'loadingIndicator';
            div.innerHTML = `
                <div class="loading-dots">
                    <span></span><span></span><span></span>
                </div>
                <span class="loading-label">Recherche en cours…</span>
            `;
            chatContainer.appendChild(div);
            scrollToBottom();
        }

        function hideLoading() {
            const el = document.getElementById('loadingIndicator');
            if (el) el.remove();
        }

        function addAnswer(data) {
            const dir = detectDir(data.answer || '');
            const confLevel = confidenceLevel(data.confidence || 0);
            const confPct = Math.round((data.confidence || 0) * 100);

            let sourcesHtml = '';
            if (data.sources && data.sources.length > 0) {
                const sourceItems = data.sources.map((s, i) => `
                    <div class="source-item">
                        <span class="idx">${i + 1}</span>
                        <span>${escapeHtml(s.text || s.source || JSON.stringify(s))}</span>
                        ${s.score != null ? `<span class="score">${Math.round(s.score * 100)}%</span>` : ''}
                    </div>
                `).join('');

                sourcesHtml = `
                    <button class="sources-toggle" onclick="toggleSources(this)">
                        <span>📎 ${data.sources.length} source(s)</span>
                        <span class="arrow">▼</span>
                    </button>
                    <div class="sources-list">${sourceItems}</div>
                `;
            }

            let abstainHtml = '';
            if (data.abstained) {
                abstainHtml = `
                    <div class="abstain-banner">
                        <span class="icon">⚠️</span>
                        <span class="text">RAFIQ n'a pas trouvé de réponse fiable dans la base documentaire. Cette réponse nécessite une vérification humaine.</span>
                    </div>
                `;
            }

            const validateUrl = `validate.html?question=${encodeURIComponent(data.question || '')}&answer=${encodeURIComponent(data.answer || '')}&confidence=${data.confidence || 0}&regime=${encodeURIComponent(data.regime || '')}&sources=${encodeURIComponent(JSON.stringify(data.sources || []))}`;

            const div = document.createElement('div');
            div.className = 'message message-answer';
            div.innerHTML = `
                <div class="answer-card">
                    <div class="answer-meta">
                        <span class="badge badge-confidence-${confLevel}">
                            <span class="badge-dot"></span>
                            ${confidenceLabel(confLevel)} · ${confPct}%
                        </span>
                        ${data.regime ? `<span class="badge badge-regime">${escapeHtml(data.regime)}</span>` : ''}
                    </div>
                    ${abstainHtml}
                    <div class="answer-text" dir="${dir}">${escapeHtml(data.answer || '')}</div>
                    ${sourcesHtml}
                    <div class="answer-actions">
                        <a href="${validateUrl}" class="btn-validate">
                            ✓ Valider
                        </a>
                    </div>
                </div>
            `;
            chatContainer.appendChild(div);
            scrollToBottom();
        }

        function addError(message) {
            const div = document.createElement('div');
            div.className = 'message message-answer';
            div.innerHTML = `
                <div class="answer-card" style="border-color: var(--abstain-border);">
                    <div class="abstain-banner">
                        <span class="icon">❌</span>
                        <span class="text">${escapeHtml(message)}</span>
                    </div>
                </div>
            `;
            chatContainer.appendChild(div);
            scrollToBottom();
        }

        // ===== Interactions =====
        function toggleSources(btn) {
            btn.classList.toggle('open');
            const list = btn.nextElementSibling;
            list.classList.toggle('open');
        }

        function useSuggestion(chip) {
            questionInput.value = chip.textContent.trim();
            questionInput.focus();
            submitQuestion();
        }

        async function submitQuestion() {
            const text = questionInput.value.trim();
            if (!text || isLoading) return;

            isLoading = true;
            sendBtn.disabled = true;
            questionInput.value = '';

            addQuestion(text);
            showLoading();

            try {
                const res = await fetch('/api/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: text }),
                });

                hideLoading();

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.detail || `Erreur serveur (${res.status})`);
                }

                const data = await res.json();
                data.question = text;
                addAnswer(data);
            } catch (err) {
                hideLoading();
                addError(err.message || 'Une erreur est survenue. Veuillez réessayer.');
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                questionInput.focus();
            }
        }

        // ===== Event Listeners =====
        sendBtn.addEventListener('click', submitQuestion);
        questionInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitQuestion();
            }
        });
    </script>
</body>
</html>

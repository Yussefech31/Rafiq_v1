<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RAFIQ — Validation experte des réponses IA">
    <title>RAFIQ — Validation Experte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== Design Tokens (shared with index.html) ===== */
        :root {
            --bg-deep: #0a0f1c;
            --bg-dark: #111827;
            --bg-card: rgba(17, 24, 39, 0.65);
            --bg-input: rgba(15, 23, 42, 0.7);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glass-hover: rgba(255, 255, 255, 0.15);

            --accent-teal: #10b981;
            --accent-teal-dim: rgba(16, 185, 129, 0.15);
            --accent-teal-glow: rgba(16, 185, 129, 0.3);
            --accent-gold: #f59e0b;
            --accent-gold-dim: rgba(245, 158, 11, 0.15);

            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            --success-bg: rgba(16, 185, 129, 0.12);
            --success-border: rgba(16, 185, 129, 0.35);
            --error-bg: rgba(239, 68, 68, 0.12);
            --error-border: rgba(239, 68, 68, 0.4);

            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;

            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --transition-fast: 180ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 350ms cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-glow: 0 0 30px rgba(16, 185, 129, 0.08);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            min-height: 100vh;
            font-family: var(--font-family);
            background: linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-dark) 50%, #0d1321 100%);
            color: var(--text-primary);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 600px 400px at 15% 20%, rgba(16, 185, 129, 0.04), transparent),
                radial-gradient(ellipse 500px 500px at 85% 80%, rgba(245, 158, 11, 0.03), transparent);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== Top Bar ===== */
        .topbar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 24px;
            background: rgba(10, 15, 28, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .topbar-logo {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--accent-teal), #059669);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }

        .topbar-text h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-teal));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .topbar-text .subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .topbar-actions {
            margin-left: auto;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-glass);
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all var(--transition-fast);
            font-family: var(--font-family);
        }

        .btn-back:hover {
            border-color: var(--accent-teal);
            color: var(--accent-teal);
            background: var(--accent-teal-dim);
        }

        /* ===== Main Content ===== */
        .content {
            max-width: 780px;
            margin: 0 auto;
            padding: 32px 24px 64px;
            position: relative;
            z-index: 1;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 0.5s ease-out;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 32px;
            animation: fadeInUp 0.5s ease-out 0.1s both;
        }

        /* ===== Cards ===== */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-glow);
            animation: fadeInUp 0.5s ease-out both;
        }

        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.2s; }
        .card:nth-child(4) { animation-delay: 0.3s; }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .card-header .icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .card-header .icon-question {
            background: var(--accent-teal-dim);
        }

        .card-header .icon-answer {
            background: rgba(99, 102, 241, 0.12);
        }

        .card-header .icon-edit {
            background: var(--accent-gold-dim);
        }

        .card-header h2 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-body {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-primary);
        }

        .card-body[dir="rtl"] {
            text-align: right;
            font-size: 16px;
        }

        /* ===== Form Elements ===== */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-textarea {
            width: 100%;
            min-height: 160px;
            padding: 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-glass);
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 15px;
            line-height: 1.7;
            resize: vertical;
            outline: none;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .form-textarea:focus {
            border-color: var(--accent-teal);
            box-shadow: 0 0 0 3px var(--accent-teal-dim);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-glass);
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 14px;
            outline: none;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .form-input:focus {
            border-color: var(--accent-teal);
            box-shadow: 0 0 0 3px var(--accent-teal-dim);
        }

        /* Checkbox */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-glass);
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .checkbox-group:hover {
            border-color: var(--border-glass-hover);
            background: rgba(255, 255, 255, 0.04);
        }

        .checkbox-group input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 5px;
            border: 2px solid var(--border-glass-hover);
            background: transparent;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: all var(--transition-fast);
        }

        .checkbox-group input[type="checkbox"]:checked {
            background: var(--accent-teal);
            border-color: var(--accent-teal);
        }

        .checkbox-group input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
        }

        .checkbox-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .checkbox-label small {
            display: block;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 2px;
        }

        /* ===== Buttons ===== */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            border-radius: var(--radius-xl);
            border: none;
            background: linear-gradient(135deg, var(--accent-teal), #059669);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font-family);
            transition: all var(--transition-fast);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== Feedback ===== */
        .feedback {
            display: none;
            padding: 16px 20px;
            border-radius: var(--radius-md);
            margin-top: 20px;
            animation: fadeInUp 0.4s ease-out;
        }

        .feedback.show { display: block; }

        .feedback-success {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: #6ee7b7;
        }

        .feedback-error {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: #fca5a5;
        }

        .feedback h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .feedback p {
            font-size: 13px;
            line-height: 1.6;
            opacity: 0.9;
        }

        .feedback .doc-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 8px 16px;
            border-radius: var(--radius-xl);
            background: rgba(255, 255, 255, 0.08);
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all var(--transition-fast);
        }

        .feedback .doc-link:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* ===== Animations ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== Responsive ===== */
        @media (max-width: 640px) {
            .topbar { padding: 12px 16px; }
            .content { padding: 24px 16px 48px; }
            .page-title { font-size: 23px; }
            .card { padding: 18px; }
        }
    </style>
</head>
<body>
    <!-- ===== Top Bar ===== -->
    <header class="topbar">
        <div class="topbar-logo">R</div>
        <div class="topbar-text">
            <h1>RAFIQ</h1>
            <div class="subtitle">Validation Experte</div>
        </div>
        <div class="topbar-actions">
            <a href="index.html" class="btn-back">← Retour au chat</a>
        </div>
    </header>

    <!-- ===== Content ===== -->
    <div class="content">
        <h1 class="page-title">Validation de la réponse</h1>
        <p class="page-subtitle">Vérifiez, corrigez et validez la réponse générée par RAFIQ avant sa publication.</p>

        <!-- Original Question -->
        <div class="card">
            <div class="card-header">
                <div class="icon icon-question">❓</div>
                <h2>Question originale</h2>
            </div>
            <div class="card-body" id="originalQuestion">—</div>
        </div>

        <!-- Original AI Answer -->
        <div class="card">
            <div class="card-header">
                <div class="icon icon-answer">🤖</div>
                <h2>Réponse IA originale</h2>
            </div>
            <div class="card-body" id="originalAnswer">—</div>
        </div>

        <!-- Validation Form -->
        <div class="card">
            <div class="card-header">
                <div class="icon icon-edit">✏️</div>
                <h2>Réponse validée</h2>
            </div>

            <form id="validateForm">
                <div class="form-group">
                    <label class="form-label" for="validatedAnswer">Modifiez la réponse si nécessaire</label>
                    <textarea class="form-textarea" id="validatedAnswer" placeholder="Réponse corrigée et validée..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label" for="validatorName">Nom du validateur</label>
                    <input class="form-input" type="text" id="validatorName" placeholder="ex: Dr. Amina Benali" required>
                </div>

                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" id="generateDoc">
                        <span class="checkbox-label">
                            Générer un document officiel
                            <small>Créer un document Word formaté avec la réponse validée</small>
                        </span>
                    </label>
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    ✓ Valider &amp; Enregistrer
                </button>
            </form>

            <div class="feedback" id="feedbackBox">
                <h3 id="feedbackTitle"></h3>
                <p id="feedbackMessage"></p>
                <a class="doc-link" id="docLink" style="display:none;" href="#" target="_blank">📄 Télécharger le document</a>
            </div>
        </div>
    </div>

    <script>
        // ===== Helpers =====
        function detectDir(text) {
            const arabicRegex = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/;
            return arabicRegex.test(text) ? 'rtl' : 'ltr';
        }

        function getParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name) || '';
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ===== Init =====
        const question = getParam('question');
        const answer = getParam('answer');
        const confidence = getParam('confidence');
        const regime = getParam('regime');
        let sources = [];
        try {
            const sourcesParam = getParam('sources');
            if (sourcesParam) {
                sources = JSON.parse(sourcesParam);
            }
        } catch (e) {
            sources = [];
        }

        const questionEl = document.getElementById('originalQuestion');
        const answerEl = document.getElementById('originalAnswer');
        const validatedAnswerEl = document.getElementById('validatedAnswer');

        if (question) {
            questionEl.textContent = question;
            questionEl.dir = detectDir(question);
        }

        if (answer) {
            answerEl.textContent = answer;
            answerEl.dir = detectDir(answer);
            validatedAnswerEl.value = answer;
        }

        // ===== Form Submit =====
        const form = document.getElementById('validateForm');
        const submitBtn = document.getElementById('submitBtn');
        const feedbackBox = document.getElementById('feedbackBox');
        const feedbackTitle = document.getElementById('feedbackTitle');
        const feedbackMessage = document.getElementById('feedbackMessage');
        const docLink = document.getElementById('docLink');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const validatedAnswer = validatedAnswerEl.value.trim();
            const validatorName = document.getElementById('validatorName').value.trim();
            const generateDoc = document.getElementById('generateDoc').checked;

            if (!validatedAnswer || !validatorName) {
                showFeedback('error', 'Champs requis', 'Veuillez remplir la réponse validée et votre nom.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Envoi en cours…';

            try {
                const res = await fetch('/api/validate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        original_answer: answer,
                        validated_answer: validatedAnswer,
                        validator_name: validatorName,
                        generate_document: generateDoc,
                        confidence: parseFloat(confidence) || 0,
                        regime: regime || 'medium',
                        sources: sources,
                    }),
                });

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.detail || `Erreur serveur (${res.status})`);
                }

                const data = await res.json();
                const qaId = data.qa_id || '—';

                let msg = `Réponse validée enregistrée avec succès.\nIdentifiant : ${qaId}`;

                showFeedback('success', '✓ Validation enregistrée', msg);

                if (generateDoc && data.qa_id) {
                    docLink.href = `/api/document/${data.qa_id}`;
                    docLink.style.display = 'inline-flex';
                } else {
                    docLink.style.display = 'none';
                }

            } catch (err) {
                showFeedback('error', 'Erreur', err.message || 'Une erreur est survenue.');
                docLink.style.display = 'none';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '✓ Valider & Enregistrer';
            }
        });

        function showFeedback(type, title, message) {
            feedbackBox.className = `feedback show feedback-${type}`;
            feedbackTitle.textContent = title;
            feedbackMessage.textContent = message;
            feedbackBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
